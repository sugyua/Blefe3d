name: Testar regras do Blefe Color

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regras:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Compilar arquivos Python
        run: python -m compileall -q server.py tests
      - name: Verificar sintaxe do JavaScript
        run: node --check public/app.js
      - name: Testar abandono, carteira fictícia e salas humanas
        run: python -m unittest discover -s tests -v
